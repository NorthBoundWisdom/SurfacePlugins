name: Swift
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build --build-path build/swiftpm
      - run: swift test --build-path build/swiftpm
        env:
          SURFACE_DEVICE_SCENARIO_REPORT: build/device-scenarios.json
      - run: python3 -B -m unittest discover -s clients/python/tests
      - run: python3 -B -m unittest discover -s clients/python/tests -p test_surface_conformance.py
      - run: python3 -B -m unittest discover -s integrations/pipe/tests
      - run: swift run --build-path build/swiftpm surface-control-schema > build/surface-control-tools.json && diff build/surface-control-tools.json docs/surface-control-tools.json
      - run: swift run --build-path build/swiftpm surface-control-schema --examples > build/surface-control-examples.json && diff build/surface-control-examples.json docs/surface-control-examples.json
      - run: python3 -m venv build/schema-validation && build/schema-validation/bin/python -m pip install jsonschema
      - run: build/schema-validation/bin/python scripts/validate_surface_control_schemas.py --examples build/surface-control-examples.json
      - run: build/schema-validation/bin/python -B scripts/validate_surface_conformance_reports.py
      - run: python3 configs/check_boundaries.py
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: swift --version
      - run: swift build --build-path build/swiftpm
      - run: swift test --build-path build/swiftpm
        env:
          SURFACE_DEVICE_SCENARIO_REPORT: build/device-scenarios.json
      - run: python3 -B -m unittest discover -s clients/python/tests
      - run: python3 -B -m unittest discover -s clients/python/tests -p test_surface_conformance.py
      - run: python3 -B -m unittest discover -s integrations/pipe/tests
      - run: swift run --build-path build/swiftpm surface-control-schema > build/surface-control-tools.json && diff build/surface-control-tools.json docs/surface-control-tools.json
      # This check reads source and SwiftPM metadata; it never invokes git.
      - run: swift run --build-path build/swiftpm surface-control-schema --examples > build/surface-control-examples.json && diff build/surface-control-examples.json docs/surface-control-examples.json
      - run: python3 -m venv build/schema-validation && build/schema-validation/bin/python -m pip install jsonschema
      - run: build/schema-validation/bin/python scripts/validate_surface_control_schemas.py --examples build/surface-control-examples.json
      - run: build/schema-validation/bin/python -B scripts/validate_surface_conformance_reports.py
      - run: python3 configs/check_boundaries.py
