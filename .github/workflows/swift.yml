name: Swift
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.0'
      - run: swift build --build-path build/swiftpm
      - run: swift test --build-path build/swiftpm
      - run: python3 configs/check_boundaries.py
